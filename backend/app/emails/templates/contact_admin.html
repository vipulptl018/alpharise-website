<!DOCTYPE html><html><body style="font-family:Arial,sans-serif;color:#0f172a">
<h2>New contact inquiry</h2>
<p><strong>Name:</strong> {{ inquiry.full_name }}</p>
<p><strong>Email:</strong> {{ inquiry.email }}</p>
<p><strong>Phone:</strong> {{ inquiry.phone }}</p>
<p><strong>Company:</strong> {{ inquiry.company or "N/A" }}</p>
<p><strong>Subject:</strong> {{ inquiry.subject }}</p>
<p><strong>Message:</strong></p>
<p>{{ inquiry.message }}</p>
<p><strong>Date:</strong> {{ inquiry.created_at }}</p>
<p><strong>IP:</strong> {{ inquiry.ip_address or "N/A" }}</p>
<p>{{ company }}</p>
</body></html>
