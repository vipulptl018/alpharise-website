# Render Blueprint — ALPHARISE Contact API only
# Dashboard Root Directory MUST be: backend
#
# Production stack: Render Free + Supabase PostgreSQL + Gmail SMTP
# No Redis, Celery, VPS, Nginx, or Docker Compose.

services:
  - type: web
    name: alpharise-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: ALPHARISE API
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_VERSION
        value: "1.0.0"
      - key: API_V1_PREFIX
        value: /api/v1
      - key: LOG_LEVEL
        value: INFO
      - key: HOST
        value: 0.0.0.0
      - key: CORS_ORIGINS
        value: https://alphariseinnovation.com,https://www.alphariseinnovation.com
      - key: CORS_ORIGIN_REGEX
        value: "https://.*\\.vercel\\.app"
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USE_TLS
        value: "true"
      - key: SMTP_USE_SSL
        value: "false"
      - key: SMTP_USERNAME
        value: alphariseinnovations@gmail.com
      - key: SMTP_FROM
        value: alphariseinnovations@gmail.com
      - key: SMTP_FROM_NAME
        value: ALPHARISE
      - key: CONTACT_NOTIFY_EMAIL
        value: admin@alphariseinnovation.com
      # Secrets — set in Render Dashboard only
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SMTP_PASSWORD
        sync: false
