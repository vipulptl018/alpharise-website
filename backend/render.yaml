# Render Blueprint — ALPHARISE Contact API only
# Root Directory on Render MUST be: backend
#
# Production: Render Free + Supabase PostgreSQL + Resend (HTTPS email)

services:
  - type: web
    name: alpharise-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: ALPHARISE API
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_VERSION
        value: "1.0.0"
      - key: API_V1_PREFIX
        value: /api/v1
      - key: LOG_LEVEL
        value: INFO
      - key: HOST
        value: 0.0.0.0
      - key: CORS_ORIGINS
        value: https://alphariseinnovation.com,https://www.alphariseinnovation.com
      - key: CORS_ORIGIN_REGEX
        value: "https://.*\\.vercel\\.app"
      - key: RESEND_FROM
        value: ALPHARISE <noreply@alphariseinnovation.com>
      - key: CONTACT_NOTIFY_EMAIL
        value: admin@alphariseinnovation.com
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
